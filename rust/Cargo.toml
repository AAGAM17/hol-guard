[workspace]
members = [
    "crates/guard-archive",
    "crates/guard-command",
    "crates/guard-contracts",
    "crates/guard-rules",
    "crates/guard-scanner",
    "crates/guard-seatbelt",
    "crates/guard-secure-fs",
    "crates/guard-hook-core",
    "crates/guard-policy-snapshot",
    "crates/guard-rule-contract",
    "crates/guard-runtime",
    "crates/guard-runtime-windows-process",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
hex = "0.4.3"
fs2 = "0.4.3"
ring = "0.17.14"
getrandom = "0.3.3"
libc = "0.2.175"
nix = { version = "0.31.3", features = ["fs", "poll", "process", "signal", "socket"] }
regex = "1.11.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
aes = "0.8.4"
base64ct = "1.7.3"
cbc = "0.1.2"
hmac = "0.12.1"
sha2 = "0.10.9"
sha1 = "0.10.6"
pbkdf2 = "0.12.2"
base32ct = { version = "0.2.0", features = ["alloc"] }
sysinfo = "=0.37.2"
thiserror = "2.0.16"
windows-permissions = "0.2.4"
winapi = "0.3.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
correctness = "deny"
suspicious = "deny"
