name: Guard Gauntlet gate

on:
  pull_request:
    paths:
      - 'ci/gauntlet/**'
      - 'tests/test_guard_gauntlet*.py'
      - '.github/workflows/guard-gauntlet*.yml'
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to inspect without executing its code
        required: true
        type: string
      candidate_sha:
        description: Full current pull request head SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: '3.12.14'
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv run --no-sync pytest -q tests/test_guard_gauntlet_ci.py

  initialize:
    env:
      GUARD_GAUNTLET_BOOTSTRAP_VERIFIER_SHA: ${{ github.ref == 'refs/tags/guard-gauntlet-bootstrap-v2' && github.sha || '' }}
    if: github.event_name != 'pull_request' && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    steps:
      # pull_request_target deliberately keeps the default trusted-base checkout.
      # No fork, PR head, merge ref or uploaded artifact is checked out or executed.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.ref == 'refs/tags/guard-gauntlet-bootstrap-v2' && github.sha || github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.14'
      - name: Require fresh live evidence when enforcement changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f ci/gauntlet/pr_requirement.py ]; then
            echo "::notice::Gauntlet is absent from the trusted base. Use the reviewed initial-installation verifier. No qualification is granted."
            exit 0
          fi
          python -m ci.gauntlet.github_ci initialize
