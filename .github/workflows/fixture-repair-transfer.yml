name: One-off fixture repair source transfer
on:
  push:
    branches: [work/fixture-repair-transfer-20261002]
    paths: [.github/workflows/fixture-repair-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'hashgraph-online/hol-guard' && github.ref == 'refs/heads/work/fixture-repair-transfer-20261002'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install exact source transformation tools
        run: python3 -m pip install --target "$RUNNER_TEMP/fixture-transfer-tools" ruff==0.15.17 pyyaml==6.0.3
      - name: Verify and upload source blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ runner.temp }}/fixture-transfer-tools
        run: python3 .repair-transfer/review_revision.py
